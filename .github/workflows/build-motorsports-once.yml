name: Build motorsports data (temporary)
# run 2
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
    paths: [".github/workflows/build-motorsports-once.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: python scripts/update_motorsports.py
      - name: Report
        run: |
          python3 - <<'PY'
          import json
          tracks = json.load(open("data/motorsports/tracks.json"))["circuits"]
          for name in ["f1", "nascar", "imsa", "wec"]:
              d = json.load(open(f"data/motorsports/{name}.json"))
              circuits = list(d.get("circuitArticles", {}))
              hits = [c for c in circuits if tracks.get(c, {}).get("maps")]
              print(name, len(hits), "of", len(circuits), "| no map:", [(c, tracks.get(c, {}).get("article")) for c in circuits if c not in hits])
          for c in ["Daytona International Speedway", "Circuit de la Sarthe", "Las Vegas Strip Circuit"]:
              print(c, tracks.get(c))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/motorsports
          git commit -m "Motorsports track maps" || exit 0
          git pull --rebase origin claude/dazzling-hamilton-4jcfnt && git push origin HEAD:claude/dazzling-hamilton-4jcfnt
