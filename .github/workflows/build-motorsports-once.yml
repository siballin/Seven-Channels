name: Build motorsports data (temporary)
# run 2
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
    paths: [".github/workflows/build-motorsports-once.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: python scripts/update_motorsports.py
      - name: Report
        run: |
          python3 - <<'PY'
          import json
          heads = json.load(open("data/motorsports/headshots.json"))["drivers"]
          for name in ["f1", "nascar", "imsa", "wec"]:
              d = json.load(open(f"data/motorsports/{name}.json"))
              drivers = list(d.get("driverArticles", {}))
              hits = [x for x in drivers if heads.get(x, {}).get("url")]
              print(name, len(hits), "of", len(drivers), "| sample without:", [x for x in drivers if x not in hits][:15])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/motorsports
          git commit -m "Motorsports driver headshots" || exit 0
          git pull --rebase origin claude/dazzling-hamilton-4jcfnt && git push origin HEAD:claude/dazzling-hamilton-4jcfnt
