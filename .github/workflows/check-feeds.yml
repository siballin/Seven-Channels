name: Check news feeds (temporary)
on:
  push:
    branches: ["claude/dazzling-hamilton-4jcfnt"]
    paths: [".github/workflows/check-feeds.yml", "scripts/check_feeds.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd scripts && python check_feeds.py
