name: Publish Seven Channels

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh game release data
        run: python scripts/update_game_releases.py
      - name: Refresh games news, trailers and free games
        continue-on-error: true
        run: python scripts/update_games_sidebar.py
      - name: Restore last game catalog
        uses: actions/cache/restore@v4
        with:
          path: data/games-catalog
          key: games-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: games-catalog-
      - name: Refresh game catalog from IGDB
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/update_game_catalog.py
      - name: Cache game catalog
        if: hashFiles('data/games-catalog/index.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/games-catalog
          key: games-catalog-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh K-pop calendar preview
        continue-on-error: true
        run: python scripts/update_kpop_releases.py
      - name: Refresh K-pop news and videos
        continue-on-error: true
        run: python scripts/update_kpop_sidebar.py
      - name: Restore last Politics snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/politics.json
          key: politics-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: politics-snapshot-
      - name: Refresh Politics data
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python scripts/update_politics.py
      - name: Cache Politics snapshot
        uses: actions/cache/save@v4
        with:
          path: data/politics.json
          key: politics-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore last Congress member snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/congress-members.json
          key: congress-members-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: congress-members-
      - name: Refresh Congress member database
        continue-on-error: true
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python scripts/update_congress_members.py
      - name: Cache Congress member snapshot
        uses: actions/cache/save@v4
        with:
          path: data/congress-members.json
          key: congress-members-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh preliminary 2026 election results
        continue-on-error: true
        run: python scripts/update_election_2026.py
      - name: Restore last bowling ball snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/bowling-balls.json
          key: bowling-balls-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bowling-balls-
      - name: Refresh bowling ball specs
        continue-on-error: true
        run: python scripts/update_bowling_balls.py
      - name: Cache bowling ball snapshot
        uses: actions/cache/save@v4
        with:
          path: data/bowling-balls.json
          key: bowling-balls-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore last Music Lab snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/music-lab.json
          key: music-lab-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: music-lab-
      - name: Refresh Music Lab credits from MusicBrainz
        continue-on-error: true
        run: python scripts/update_music_lab.py
      - name: Cache Music Lab snapshot
        uses: actions/cache/save@v4
        with:
          path: data/music-lab.json
          key: music-lab-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
