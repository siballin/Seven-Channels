name: Publish Seven Channels

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh game release data
        run: python scripts/update_game_releases.py
      - name: Refresh games news, trailers and free games
        continue-on-error: true
        run: python scripts/update_games_sidebar.py
      - name: Refresh Steam library
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python scripts/update_steam.py
      - name: Refresh esports matches
        continue-on-error: true
        env:
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
        run: python scripts/update_esports.py
      - name: Restore last game catalog
        uses: actions/cache/restore@v4
        with:
          path: data/games-catalog
          key: games-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: games-catalog-
      - name: Refresh game catalog from IGDB
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/update_game_catalog.py
      - name: Cache game catalog
        if: hashFiles('data/games-catalog/index.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/games-catalog
          key: games-catalog-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh K-pop calendar preview
        continue-on-error: true
        run: python scripts/update_kpop_releases.py
      - name: Refresh K-pop-adjacent releases from MusicBrainz
        continue-on-error: true
        run: python scripts/update_kpop_extra.py
      - name: Refresh K-pop news and videos
        continue-on-error: true
        run: python scripts/update_kpop_sidebar.py
      - name: Restore last idol directory
        uses: actions/cache/restore@v4
        with:
          path: data/idols
          key: idols-${{ github.run_id }}
          restore-keys: idols-
      - name: Refresh idol directory from Wikidata, Wikipedia and Commons (weekly, or when overrides change)
        continue-on-error: true
        run: python scripts/build_idols.py
      - name: Cache idol directory
        uses: actions/cache/save@v4
        with:
          path: data/idols
          key: idols-${{ github.run_id }}
      - name: Refresh motorsports (F1, NASCAR, IMSA, WEC)
        continue-on-error: true
        run: python scripts/update_motorsports.py
      - name: Refresh NBA logo and uniform history from Wikipedia (every 30 days)
        continue-on-error: true
        run: python scripts/build_nba_team_history.py
      - name: Restore SportsLogos.Net images
        uses: actions/cache/restore@v4
        with:
          path: data/sportslogos
          key: sportslogos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sportslogos-
      - name: Refresh NBA logo and uniform history from SportsLogos.Net (every 30 days; credited, non-commercial use)
        continue-on-error: true
        run: python scripts/build_sportslogos.py
      - name: Cache SportsLogos.Net images
        if: hashFiles('data/sportslogos/img/*') != ''
        uses: actions/cache/save@v4
        with:
          path: data/sportslogos
          key: sportslogos-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore last NBA player database
        uses: actions/cache/restore@v4
        with:
          path: data/nba
          key: nba-players-${{ github.run_id }}
          restore-keys: nba-players-
      - name: Refresh NBA player database from ESPN (weekly; retired players are kept)
        continue-on-error: true
        run: python scripts/build_nba_players.py
      - name: Refresh NBA headshots for players ESPN has none for (NBA.com, then Wikimedia Commons; monthly)
        continue-on-error: true
        run: python scripts/build_nba_headshots.py
      - name: Cache NBA player database
        uses: actions/cache/save@v4
        with:
          path: data/nba
          key: nba-players-${{ github.run_id }}
      - name: Refresh Politics news (The Hill, Politico, Punchbowl News, Roll Call, Axios)
        continue-on-error: true
        run: python scripts/update_politics_news.py
      - name: Refresh channel news columns (Movies, Anime, Bowling, Music Lab, Live Events, Betting, Creator Studio, Guide)
        continue-on-error: true
        run: cd scripts && python update_channel_news.py
      - name: Restore last Politics snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/politics.json
          key: politics-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: politics-snapshot-
      - name: Refresh Politics data
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python scripts/update_politics.py
      - name: Cache Politics snapshot
        uses: actions/cache/save@v4
        with:
          path: data/politics.json
          key: politics-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore last Congress member snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/congress-members.json
          key: congress-members-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: congress-members-
      - name: Refresh Congress member database
        continue-on-error: true
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python scripts/update_congress_members.py
      - name: Cache Congress member snapshot
        uses: actions/cache/save@v4
        with:
          path: data/congress-members.json
          key: congress-members-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh preliminary 2026 election results
        continue-on-error: true
        run: python scripts/update_election_2026.py
      - name: Refresh preliminary governor results
        continue-on-error: true
        run: python scripts/build_governors.py --preliminary
      - name: Rebuild the midterm comparison
        continue-on-error: true
        run: python scripts/build_midterm_summary.py
      - name: Restore last bowling ball snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/bowling-balls.json
          key: bowling-balls-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bowling-balls-
      - name: Refresh bowling ball specs
        continue-on-error: true
        run: python scripts/update_bowling_balls.py
      - name: Cache bowling ball snapshot
        uses: actions/cache/save@v4
        with:
          path: data/bowling-balls.json
          key: bowling-balls-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore last Music Lab snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/music-lab.json
          key: music-lab-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: music-lab-
      - name: Refresh Music Lab credits from MusicBrainz, Discogs and Genius
        continue-on-error: true
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
        run: python scripts/update_music_lab.py
      - name: Cache Music Lab snapshot
        uses: actions/cache/save@v4
        with:
          path: data/music-lab.json
          key: music-lab-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh setlists from setlist.fm
        continue-on-error: true
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: python scripts/update_setlists.py
      - name: Build minified site
        # Copies the site into _site/ and minifies JS and CSS; any file that can't be minified is published as is.
        run: |
          python scripts/build_site.py || { rm -rf _site && mkdir _site && cp -r index.html *.js assets data docs _site/; }
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub sometimes can't see the just-uploaded files for a few seconds ("No artifacts named github-pages"), so wait and try once more.
      - name: Deploy site
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy site (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
