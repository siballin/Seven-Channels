name: Check politics feeds (temporary)
on:
  push:
    branches: ["claude/dazzling-hamilton-4jcfnt"]
    paths: [".github/workflows/check-politics-feeds.yml", "scripts/update_politics_news.py", "scripts/check_politics_feeds.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd scripts && python check_politics_feeds.py
