name: Build SportsLogos.Net history (temporary)
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
    paths: [scripts/build_sportslogos.py, .github/workflows/build-sportslogos-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_sportslogos.py --force 2>&1 | tail -40
      - run: |
          du -sh data/sportslogos/img; ls data/sportslogos/img | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/sportslogos.json && git commit -m "SportsLogos.Net logo and uniform history"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
