name: Check minified build (temporary)
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: python scripts/build_site.py
      - name: Syntax and global names
        run: |
          for f in _site/*.js; do node --check "$f" || exit 1; done
          python3 - <<'PY'
          import re, sys
          src = open("index.html").read(); out = open("_site/index.html").read()
          inline = re.search(r"<script>(.*?)</script>", out, re.S).group(1)
          open("/tmp/inline.js", "w").write(inline)
          missing = []
          import glob
          for f in glob.glob("*.js") + ["index.html"]:
              code = open(f).read(); mini = open("_site/" + f).read()
              for name in re.findall(r"^\s{0,4}(?:async )?function (\w+)\(", code, re.M):
                  if not re.search(r"function " + name + r"\(", mini): missing.append(f + ":" + name)
          print("renamed top-level functions:", missing[:20])
          sys.exit(1 if missing else 0)
          PY
          node --check /tmp/inline.js
      - name: Browser smoke test
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE/_site" && (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
          cp "$GITHUB_WORKSPACE/scripts/check_build.js" /tmp/pw/ && cd /tmp/pw && node check_build.js
