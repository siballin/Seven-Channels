name: Probe game data sources (temporary)
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
    paths: [scratch-probe/**, .github/workflows/probe-games-once.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scratch-probe/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          mv probe-output.txt scratch-probe/output.txt
          git add scratch-probe/output.txt
          git commit -m "Probe output"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
