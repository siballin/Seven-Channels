name: Build NBA team history (temporary)
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
    paths: [scripts/build_nba_team_history.py, .github/workflows/build-history-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_nba_team_history.py --force
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/nba-team-history.json && git commit -m "NBA team logo and uniform history"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
