name: Build idol data (temporary)
# run 9
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
    paths: [".github/workflows/build-idols-once.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: python scripts/build_idols.py --force
      - name: Report
        run: |
          python3 - <<'PY'
          import json
          index = json.load(open("data/idols/index.json"))
          groups = json.load(open("data/idols/groups.json"))["groups"]
          print("groups", len(index["groups"]), "people", len(index["people"]))
          print("with photo", sum(1 for p in index["people"] if p["p"]), "with birth", sum(1 for p in index["people"] if p["b"]))
          print("fandom matched", sorted(g["name"] for g in groups.values() if g.get("fandom")))
          for name in ["XG", "Stray Kids", "aespa", "BTS", "Blackpink", "Twice", "Le Sserafim", "XG", "tripleS", "NCT", "Seventeen", "(G)I-dle", "i-dle"]:
              hits = [g for g in groups.values() if g["name"].lower() == name.lower()]
              print(name, [(g["id"], g["name"], g["debut"], len(g["members"]), [m["name"] for m in g["members"]][:12]) for g in hits])
          PY
          du -sh data/idols
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/idols
          git commit -m "Idol data from Wikidata, Wikipedia and Commons" || exit 0
          git pull --rebase origin claude/dazzling-hamilton-4jcfnt && git push origin HEAD:claude/dazzling-hamilton-4jcfnt
