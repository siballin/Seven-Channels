name: Check Steam and esports (temporary)
on:
  push:
    branches: [claude/dazzling-hamilton-4jcfnt]
    paths: [.github/workflows/check-keys-once.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python scripts/update_steam.py 2>&1 | tee steam-log.txt
      - name: Esports
        env:
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
        run: python scripts/update_esports.py 2>&1 | tee esports-log.txt
      - name: Summaries (no personal data committed)
        run: |
          python - <<'PY'
          import json, os
          out = {"steamLog": open("steam-log.txt").read()[-1500:], "esportsLog": open("esports-log.txt").read()[-1500:]}
          if os.path.exists("data/steam.json"):
              d = json.load(open("data/steam.json"))
              out["steam"] = {"games": len(d["games"]), "played": sum(1 for g in d["games"] if g[2]), "recent": sum(1 for g in d["games"] if g[3]),
                              "achievementGames": len(d["achievements"]), "hasProfile": bool(d["profile"].get("name")),
                              "achievementSample": next(iter(d["achievements"].values()), None)}
          json.dump(out, open("data/keys-check.json", "w"), indent=1)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/keys-check.json data/esports.json || true
          git commit -m "Key check output" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
